<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">
  <title>Frontend Mentor | Blog preview card</title>
</head>
<body>
  <main>
    <a id="article-card" href="#">
      <div id="article-illustration">
        <img id="article-image" src="./assets/images/illustration-article.svg" alt="ilustration for the article content">
      </div>
      <span id="article-tag">Learning</span>
      <time datetime="2023-12-21" id="article-date">Published 21 Dec 2023</time>
      <h1 id="article-title">HTML & CSS foundations</h1>
      <p id="article-subtitle">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      <div id="author-data">
        <img id="author-avatar" src="./assets/images/image-avatar.webp" alt="author avatar">
        <p id="author-name">Greg Hooper</p>
      </div>
    </a>  
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/ArthurPerone/">Arthur Perone Barbosa</a>.
  </footer>
</body>
</html>
